name: Scheduled jobs

# The operational cadence for the deployed app -- currently MANUAL ONLY.
#
# These steps drive three endpoints on a live deployment: releasing due
# subscription deliveries into the KOT, draining the notification queue, and
# reconciling marketplaces. That is real work, but only once there is a
# deployment to point at. Until then a cron trigger just curls a dead URL every
# few minutes and fails, which is where the run of "Scheduled jobs workflow run
# failed for main branch" notifications came from.
#
# TO RE-ENABLE THE SCHEDULE, once the app is deployed and both repository
# secrets below are set (Settings -> Secrets and variables -> Actions):
#
#   SITE_URL     e.g. https://your-project.vercel.app  (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET env var on the deployment
#
# add this back under `on:` and restore the `if:` guards noted on each job:
#
#   schedule:
#     - cron: '*/5 * * * *'   # frequent: release + notifications
#     - cron: '17 * * * *'    # hourly:   reconciliation
#
# Running these alongside the daily Vercel crons in vercel.json is safe.
# `release_due_deliveries` locks rows with SKIP LOCKED and is idempotent, the
# notification dispatcher drains a queue, and reconciliation only records
# findings -- so an overlapping or duplicated run is a no-op rather than a
# double delivery.

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Which jobs to run'
        type: choice
        default: frequent
        options:
          - frequent
          - hourly
          - both

concurrency:
  # Never let a delayed run pile up on top of the next one.
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  frequent:
    name: Release deliveries and drain notifications
    # With the schedule restored, guard this with:
    #   github.event.schedule == '*/5 * * * *' || <the dispatch check below>
    if: inputs.job == 'frequent' || inputs.job == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Check the required secrets are set
        # Without this, an unset SITE_URL leaves curl with a bare path and the
        # failure reads as a bad hostname rather than a missing secret.
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=
          [ -n "$SITE_URL" ] || missing="$missing SITE_URL"
          [ -n "$CRON_SECRET" ] || missing="$missing CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Set them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Release due deliveries into the KOT
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "$SITE_URL/api/jobs/release-deliveries" \
            -H "Authorization: Bearer $CRON_SECRET"

      - name: Dispatch queued notifications
        # A notification provider being down must never hide a release failure,
        # so this reports separately rather than short-circuiting the job.
        if: always()
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "$SITE_URL/api/jobs/notifications" \
            -H "Authorization: Bearer $CRON_SECRET"

  hourly:
    name: Reconcile marketplaces
    # With the schedule restored, guard this with:
    #   github.event.schedule == '17 * * * *' || <the dispatch check below>
    if: inputs.job == 'hourly' || inputs.job == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Check the required secrets are set
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=
          [ -n "$SITE_URL" ] || missing="$missing SITE_URL"
          [ -n "$CRON_SECRET" ] || missing="$missing CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Set them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Two-way marketplace reconciliation
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "$SITE_URL/api/jobs/reconcile" \
            -H "Authorization: Bearer $CRON_SECRET"
